server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS；避免 kb-api 容器重建后 nginx 仍指向旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 知识库四库 + 机器人检索 → kb-api
    location /api/knowledge/ {
        set $kb_api_upstream kb-api:8080;
        proxy_pass http://$kb_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/robot/ {
        set $kb_api_upstream kb-api:8080;
        proxy_pass http://$kb_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Robot-Api-Key $http_x_robot_api_key;
    }

    # 登录、菜单等 → backend-mock
    location /api/ {
        set $mock_upstream mock:5320;
        proxy_pass http://$mock_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
